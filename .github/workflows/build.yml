name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MultiFenetre-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK en lien direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MultiFenetre.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk MultiFenetre.apk --title "MultiFenetre APK" --notes "APK de test" --target "${{ github.sha }}"
